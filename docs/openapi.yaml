          description: "Sesión o token ausente, inválido o expirado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Rol, propietario, acceso activo, MFA o tipo de cliente no autorizado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Registro inexistente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Conflicto de estado, intervalo ocupado, duplicado o stock insuficiente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "419":
          description: "CSRF inválido o expirado en una petición web."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Validación de los datos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Demasiados intentos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Error interno sin detalles sensibles."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
        -
          name: "X-XSRF-TOKEN"
          in: "header"
          required: false
          schema:
            type: "string"
          description: "Valor vigente de la cookie XSRF-TOKEN para escrituras por sesión web."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AjustePuntosSolicitud"
components:
  securitySchemes:
    sesionWeb:
      type: "apiKey"
      in: "cookie"
      name: "laravel-session"
    tokenMovil:
      type: "http"
      scheme: "bearer"
